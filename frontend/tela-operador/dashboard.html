<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>GoodWe - Sistema Inteligente de Gerenciamento de Recarga</title>
        <link rel="stylesheet" href="./style/style-dashboard.css">
    </head>

    <body>
        <header>
            <div id="logo">GoodWe ChargeGrid Intelligence</div>
            <div id="status-sistema">
                <span id="statusTexto">
                    ● Verificando...
                </span>

                <button class="btn-atualizar" onclick="atualizarTodos()" title="Atualizar dashboard">
                    ↻ Atualizar
                </button>

                <button class="btn-tema" onclick="alternarTema()" title="Alternar tema" id="btnTema">
                    <svg id="iconeTema" viewBox="0 0 24 24">
                    <path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>
                    </svg>
                </button>
            </div>
        </header>

        <main>
            <section id="chargers">
                <div id="chargers-grid">
                </div>
            </section>


            <section id="dashboard">
                <div id="metricas">
                    <div id="val-solar"></div>
                    <div id="val-potencia"></div>
                    <div id="val-sessoes"></div>
                    <div id="val-percentual"></div>
                </div>

                <div id="ocpp-log"></div>
            </section>

            <div id="modal-nova-sessao">
                <div id="modal-conteudo">
                    <h2>Nova Sessão</h2>
                    <form id="form-nova-sessao" onsubmit="return false;">
                        <div class="form-input">
                            <label for="nome_usuario">Nome:</label>
                            <input type="text" name="nome_usuario" id="input-nome" placeholder="Nome">
                        </div>

                        <div class="form-input">
                            <label for="modo_carga">Modo de carregamento:</label>
                            <select name="modo_carga" id="input-tipo">
                                <option value="rapido">Rápido</option>
                                <option value="FV">Prioridade Solar</option>
                                <option value="FV_baterias">Solar + Bateria</option>
                            </select>
                        </div>

                        <div id="modal-erro"></div>
                        
                        <div id="form-botoes">
                            <button type="button" onclick="confirmarSessao()" id="btn-iniciar">Iniciar Sessão</button>
                            <button type="button" onclick="fecharModal()" id="btn-cancelar">Cancelar</button>
                        </div>            
                    </form>
                </div>
            </div>

            <div id="modal-relatorio">
                <div id="modal-relatorio-conteudo"></div>
            </div>
        </main>
        
        <script src="./script/script-dashboard.js"></script>
    </body>
</html>
